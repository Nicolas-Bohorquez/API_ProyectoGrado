# Apartado de conexión a la base de datos
spring.application.name=AppSegurity

# Puerto dinámico para Railway (por defecto 8080 en local)
server.port=${PORT:8080}

# URL de la base de datos MongoDB (Soporta MONGO_URI, MONGO_URL de Railway y fallback local)
spring.mongodb.uri=${MONGO_URI:${MONGO_URL:${MONGODB_URI:mongodb://localhost:27017/app_supervision}}}
spring.data.mongodb.uri=${MONGO_URI:${MONGO_URL:${MONGODB_URI:mongodb://localhost:27017/app_supervision}}}

# Un valor desconocido en un enum (tipo de evidencia, acción, categoría, nivel) llega como null y el servicio usa un valor por
# defecto, en vez de rechazar la alerta COMPLETA con un 400 sin cuerpo (así una app más nueva que el servidor no pierde alertas)
spring.jackson.datatype.enum.read-unknown-enum-values-as-null=true

# Seeders de prueba (crean cuentas con claves conocidas): APAGADOS por defecto. Para desarrollo local, arrancar con
# SEEDERS_ENABLED=true. Nunca activarlos en producción.
app.seeders.enabled=${SEEDERS_ENABLED:false}

# Retención de evidencias (fotos, capturas, audio): se borran a diario las que superan estos días. 0 = desactivada.
app.evidencias.retencion-dias=${EVIDENCIAS_RETENCION_DIAS:180}
app.evidencias.purga-cron=${EVIDENCIAS_PURGA_CRON:0 30 3 * * *}

# Configuracion de Correo Electronico (Spring Mail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nbohorquezm@unicesar.edu.co}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
